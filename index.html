<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Derby" />
    <meta name="theme-color" content="#1A1A1A" />
    <meta name="description" content="Derby — live scores, transfers, teams, favourites, Ask AI." />
    <title>Derby</title>
    <link rel="icon" href="logo.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preconnect" href="https://a.espncdn.com" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="device">
      <div class="phone">
        <header class="nav-bar">
          <div class="nav-left">
            <button type="button" class="back-btn" id="nav-back" hidden>‹ Back</button>
            <div class="brand">
              <img class="app-logo" src="logo.svg" alt="" width="46" height="46" />
              <div>
                <p class="nav-eyebrow" id="nav-date"></p>
                <h1 class="nav-title" id="nav-title">Matches</h1>
              </div>
            </div>
          </div>
          <button type="button" class="account-btn" id="account-btn" aria-label="Account">
            <span id="account-avatar" class="account-avatar" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="8" r="3.4" stroke="currentColor" stroke-width="1.8" />
                <path d="M5.5 18.2c1.4-3 3.7-4.5 6.5-4.5s5.1 1.5 6.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
              </svg>
            </span>
          </button>
        </header>

        <main class="screens">
          <section id="matches" class="screen is-active" aria-label="Matches">
            <div class="seg scroll-seg" id="match-leagues" role="tablist" aria-label="Leagues"></div>
            <div id="matches-list" class="scroll"></div>
          </section>

          <section id="transfers" class="screen" aria-label="Transfers">
            <div id="transfers-list" class="scroll"></div>
          </section>

          <section id="ask" class="screen" aria-label="Ask AI">
            <div class="ask-shell">
              <div id="ask-log" class="ask-log" aria-live="polite"></div>
              <div class="chip-row" id="ask-chips">
                <button type="button" class="chip" data-q="What matches are live right now?">What’s live?</button>
                <button type="button" class="chip" data-q="Biggest transfers from the 2027 window">2027 transfers</button>
                <button type="button" class="chip" data-q="Show my favourite teams">My favourites</button>
                <button type="button" class="chip" data-q="Tell me about Arsenal squad">Arsenal squad</button>
              </div>
              <form id="ask-form" class="ask-composer">
                <label class="sr-only" for="ask-input">Your question</label>
                <input id="ask-input" name="q" required maxlength="240" placeholder="Ask anything football…" autocomplete="off" />
                <button type="submit" class="send-btn" aria-label="Send">↑</button>
              </form>
            </div>
          </section>

          <section id="teams" class="screen" aria-label="Teams">
            <form id="team-search-form" class="team-search" role="search">
              <label class="sr-only" for="team-search-input">Search clubs and players</label>
              <input id="team-search-input" type="search" placeholder="Search clubs and players…" autocomplete="off" />
              <button type="submit" class="search-go">Search</button>
            </form>
            <div id="teams-list" class="scroll"></div>
          </section>

          <section id="favourites" class="screen" aria-label="Favourites">
            <div class="seg scroll-seg" id="fav-modes" role="tablist" aria-label="Favourites">
              <button type="button" class="seg-btn is-on" data-fav="following">Following</button>
              <button type="button" class="seg-btn" data-fav="fantasy">Fantasy</button>
            </div>
            <div id="favourites-list" class="scroll"></div>
          </section>

          <section id="account" class="screen" aria-label="Account">
            <div id="account-list" class="scroll"></div>
          </section>
        </main>

        <nav class="tab-bar" aria-label="Main">
          <button type="button" class="tab is-active" data-view="matches">
            <span class="tab-glyph" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none"><path d="M4 7.5h16M4 12h16M4 16.5h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </span>
            <span class="tab-label">Matches</span>
          </button>
          <button type="button" class="tab" data-view="transfers">
            <span class="tab-glyph" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none"><path d="M7 8h10M7 8l2.5-2.5M7 8l2.5 2.5M17 16H7M17 16l-2.5-2.5M17 16l-2.5 2.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
            <span class="tab-label">Transfers</span>
          </button>
          <button type="button" class="tab tab-center" data-view="ask">
            <span class="tab-fab" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none"><path d="M5 6.5h10a3 3 0 0 1 3 3v4a3 3 0 0 1-3 3H11l-4 3v-3H5a3 3 0 0 1-3-3v-4a3 3 0 0 1 3-3z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M8.5 11h.01M12 11h.01M15.5 11h.01" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
            </span>
            <span class="tab-label">Ask AI</span>
          </button>
          <button type="button" class="tab" data-view="teams">
            <span class="tab-glyph" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.2" stroke="currentColor" stroke-width="2"/><path d="M5 19c1.2-3.2 3.6-4.8 7-4.8S17.8 15.8 19 19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </span>
            <span class="tab-label">Teams</span>
          </button>
          <button type="button" class="tab" data-view="favourites">
            <span class="tab-glyph" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none"><path d="M12 4.8l2.1 4.3 4.7.7-3.4 3.3.8 4.7L12 15.6 7.8 17.8l.8-4.7-3.4-3.3 4.7-.7L12 4.8z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
            </span>
            <span class="tab-label">Favourites</span>
          </button>
        </nav>
      </div>
    </div>

    <script src="data.js"></script>
    <script src="api.js"></script>
    <script src="auth.js"></script>
    <script src="ai.js"></script>
    <script src="fantasy.js"></script>
    <script src="app.js"></script>
  </body>
</html>
